name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git sudo

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package with makepkg
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE/packaging' && makepkg --syncdeps --noconfirm --skippgpcheck --nocheck"

      - name: Rename packages for stable release URLs
        id: pkg
        run: |
          cd packaging
          source ./PKGBUILD
          arch="${arch[0]}"

          files=""
          for name in "${pkgname[@]}"; do
            built="$name-$pkgver-$pkgrel-$arch.pkg.tar.zst"
            pkgfile="$name-$arch.pkg.tar.zst"
            mv -- "$built" "$pkgfile"
            sha256sum "$pkgfile" > "$pkgfile.sha256"
            files="$files"$'\n'"packaging/$pkgfile"$'\n'"packaging/$pkgfile.sha256"
          done

          {
            echo "files<<PKGEOF"
            echo "$files"
            echo "PKGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.pkg.outputs.files }}
